<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title description">
  <title id="title">AWS Bedrock Knowledge Base architecture</title>
  <desc id="description">Documents flow from a user to Amazon S3, through a Bedrock ingestion process and Titan embeddings into S3 Vectors. Questions flow through an application to the Bedrock Knowledge Base, which retrieves relevant passages and sends them to Nova Lite to generate a grounded answer.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .heading { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .body { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .box { stroke-width: 2; rx: 16; }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 9 7; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#f8fafc"/>
  <text x="700" y="52" text-anchor="middle" class="title">Low-cost AWS Bedrock Knowledge Base (RAG)</text>
  <text x="700" y="82" text-anchor="middle" class="subtitle">S3 stores documents, Titan creates embeddings, S3 Vectors enables semantic search, and Nova Lite writes the answer.</text>

  <rect x="45" y="125" width="1310" height="290" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="70" y="160" class="heading">A. Prepare the knowledge base (ingestion)</text>

  <rect class="box" x="75" y="205" width="190" height="125" fill="#ffffff" stroke="#64748b"/>
  <text x="170" y="245" text-anchor="middle" class="heading">Documents</text>
  <text x="170" y="275" text-anchor="middle" class="body">PDF, Markdown, text,</text>
  <text x="170" y="298" text-anchor="middle" class="body">HTML, CSV, and more</text>

  <rect class="box" x="335" y="205" width="220" height="125" fill="#fff7ed" stroke="#f97316"/>
  <text x="445" y="245" text-anchor="middle" class="heading">Amazon S3</text>
  <text x="445" y="275" text-anchor="middle" class="body">Private source-document</text>
  <text x="445" y="298" text-anchor="middle" class="body">storage</text>

  <rect class="box" x="625" y="205" width="225" height="125" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="737" y="238" text-anchor="middle" class="heading">Bedrock ingestion</text>
  <text x="737" y="269" text-anchor="middle" class="body">Reads and splits documents</text>
  <text x="737" y="292" text-anchor="middle" class="body">into overlapping chunks</text>

  <rect class="box" x="920" y="205" width="200" height="125" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="1020" y="238" text-anchor="middle" class="heading">Titan Embeddings</text>
  <text x="1020" y="269" text-anchor="middle" class="body">Turns text meaning into</text>
  <text x="1020" y="292" text-anchor="middle" class="body">numeric vectors</text>

  <rect class="box" x="1190" y="205" width="130" height="125" fill="#fff7ed" stroke="#f97316"/>
  <text x="1255" y="238" text-anchor="middle" class="heading">S3 Vectors</text>
  <text x="1255" y="269" text-anchor="middle" class="body">Stores and</text>
  <text x="1255" y="292" text-anchor="middle" class="body">searches vectors</text>

  <path class="arrow" d="M265 267 L325 267"/>
  <path class="arrow" d="M555 267 L615 267"/>
  <path class="arrow" d="M850 267 L910 267"/>
  <path class="arrow" d="M1120 267 L1180 267"/>
  <text x="295" y="250" text-anchor="middle" class="label">upload</text>
  <text x="585" y="250" text-anchor="middle" class="label">read</text>
  <text x="880" y="250" text-anchor="middle" class="label">chunks</text>
  <text x="1150" y="250" text-anchor="middle" class="label">vectors</text>

  <rect x="45" y="455" width="1310" height="355" rx="22" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="70" y="490" class="heading">B. Answer a question (retrieval and generation)</text>

  <rect class="box" x="75" y="555" width="175" height="120" fill="#ffffff" stroke="#64748b"/>
  <text x="162" y="595" text-anchor="middle" class="heading">User</text>
  <text x="162" y="625" text-anchor="middle" class="body">Asks a question</text>

  <rect class="box" x="315" y="555" width="175" height="120" fill="#ffffff" stroke="#64748b"/>
  <text x="402" y="595" text-anchor="middle" class="heading">Application</text>
  <text x="402" y="625" text-anchor="middle" class="body">Website, chat, API</text>

  <rect class="box" x="555" y="535" width="230" height="160" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="670" y="575" text-anchor="middle" class="heading">Bedrock Knowledge Base</text>
  <text x="670" y="607" text-anchor="middle" class="body">Coordinates retrieval</text>
  <text x="670" y="630" text-anchor="middle" class="body">and returns relevant</text>
  <text x="670" y="653" text-anchor="middle" class="body">document passages</text>

  <rect class="box" x="870" y="535" width="210" height="160" fill="#fff7ed" stroke="#f97316"/>
  <text x="975" y="575" text-anchor="middle" class="heading">S3 Vectors</text>
  <text x="975" y="607" text-anchor="middle" class="body">Finds passages with</text>
  <text x="975" y="630" text-anchor="middle" class="body">similar meaning—not just</text>
  <text x="975" y="653" text-anchor="middle" class="body">matching keywords</text>

  <rect class="box" x="1150" y="535" width="170" height="160" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="1235" y="575" text-anchor="middle" class="heading">Nova Lite</text>
  <text x="1235" y="607" text-anchor="middle" class="body">Uses retrieved facts</text>
  <text x="1235" y="630" text-anchor="middle" class="body">to write a grounded</text>
  <text x="1235" y="653" text-anchor="middle" class="body">natural-language answer</text>

  <path class="arrow" d="M250 615 L305 615"/>
  <path class="arrow" d="M490 615 L545 615"/>
  <path class="arrow" d="M785 585 C815 545 830 545 860 585"/>
  <path class="arrow" d="M870 655 C835 695 820 695 785 655"/>
  <path class="arrow" d="M785 615 L1140 615"/>
  <path class="arrow dashed" d="M1150 680 C920 795 500 795 250 665"/>

  <text x="812" y="535" text-anchor="middle" class="label">search</text>
  <text x="823" y="718" text-anchor="middle" class="label">relevant passages</text>
  <text x="965" y="598" text-anchor="middle" class="label">context</text>
  <text x="700" y="785" text-anchor="middle" class="label">grounded answer returned to the user</text>

  <rect x="75" y="835" width="1245" height="42" rx="10" fill="#e2e8f0"/>
  <text x="697" y="862" text-anchor="middle" class="body">IAM roles quietly protect every connection by allowing each AWS service to perform only the actions it needs.</text>
</svg>
